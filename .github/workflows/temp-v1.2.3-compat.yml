name: Temporary v1.2.3 compatibility candidate

on:
  push:
    branches:
      - compat-omni-sprint-v1.2.3

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate source and sprint-intent behavior
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import ast
          import hashlib
          import tomllib
          import types
          import zipfile

          source = Path("__init__.py")
          text = source.read_text(encoding="utf-8")
          tree = ast.parse(text, filename=str(source))
          compile(text, str(source), "exec")

          assert 'VERSION = "1.2.3"' in text
          assert "_sprint_intent_before = (" in text
          assert "bool(movement.bWantsToSprint)" in text
          assert "bool(movement.bWantsToStartSprinting)" in text
          assert 'setattr(movement, name, True)' not in text

          # Execute only the restore function from the AST with a tiny fake
          # movement object. This verifies exact captured intent restoration
          # without importing the game SDK.
          fn = next(
              node for node in tree.body
              if isinstance(node, ast.FunctionDef)
              and node.name == "_restore_sprint_intent"
          )
          module = ast.Module(body=[fn], type_ignores=[])
          ast.fix_missing_locations(module)
          env = {
              "_sprint_intent_before": (True, False),
              "log_error": lambda _msg: None,
              "__builtins__": __builtins__,
          }
          exec(compile(module, "<restore-test>", "exec"), env)

          movement = types.SimpleNamespace(
              bWantsToSprint=False,
              bWantsToStartSprinting=True,
          )
          character = types.SimpleNamespace(CharacterMovement=movement)
          assert env["_restore_sprint_intent"](character) is True
          assert movement.bWantsToSprint is True
          assert movement.bWantsToStartSprinting is False

          env["_sprint_intent_before"] = (False, True)
          movement.bWantsToSprint = True
          movement.bWantsToStartSprinting = False
          assert env["_restore_sprint_intent"](character) is True
          assert movement.bWantsToSprint is False
          assert movement.bWantsToStartSprinting is True

          env["_sprint_intent_before"] = None
          movement.bWantsToSprint = True
          movement.bWantsToStartSprinting = False
          assert env["_restore_sprint_intent"](character) is True
          assert movement.bWantsToSprint is True
          assert movement.bWantsToStartSprinting is False

          meta = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          assert meta["project"]["version"] == meta["tool"]["sdkmod"]["version"] == "1.2.3"
          assert tuple(int(x) for x in meta["project"]["version"].split(".")) == (1, 2, 3)

          stage = Path("stage/BL4_SuperDash")
          stage.mkdir(parents=True, exist_ok=True)
          files = [
              "__init__.py",
              "pyproject.toml",
              "README.md",
              "README_RU.md",
              "LICENSE",
              "ADDITIONAL_TERMS.md",
          ]
          for name in files:
              (stage / name).write_bytes(Path(name).read_bytes())

          archive = Path("dist/BL4_SuperDash.sdkmod")
          archive.parent.mkdir(exist_ok=True)
          with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_DEFLATED) as zf:
              for path in sorted(stage.rglob("*")):
                  if path.is_file():
                      zf.write(path, path.relative_to(stage.parent).as_posix())

          with zipfile.ZipFile(archive) as zf:
              names = [n for n in zf.namelist() if n and not n.endswith("/")]
              assert {n.split("/",1)[0] for n in names} == {"BL4_SuperDash"}
              assert archive.stem == "BL4_SuperDash"
              assert "BL4_SuperDash/__init__.py" in names
              assert len(names) == 6
              assert not any("__pycache__" in n or n.endswith((".pyc",".pyo")) for n in names)

          print("source_sha256", hashlib.sha256(source.read_bytes()).hexdigest())
          print("artifact_sha256", hashlib.sha256(archive.read_bytes()).hexdigest())
          print("ALL_GATES_PASS")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: BL4-SuperDash-v1.2.3-candidate
          path: dist/BL4_SuperDash.sdkmod
          if-no-files-found: error
