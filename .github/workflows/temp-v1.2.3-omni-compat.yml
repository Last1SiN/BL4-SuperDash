name: Temporary v1.2.3 Omni Sprint compatibility candidate

on:
  push:
    branches:
      - compat-omni-sprint-v1.2.3

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import ast, hashlib, tomllib, zipfile

          source = Path("__init__.py")
          text = source.read_text(encoding="utf-8")
          ast.parse(text)
          compile(text, str(source), "exec")

          assert 'VERSION = "1.2.3"' in text
          assert "_sprint_intent_before = (" in text
          assert 'setattr(movement, name, True)' not in text
          assert "_dash_request_neutral = sequence_kind == SequenceKind.DASH" in text
          assert "_forward_gate_neutral" not in text
          assert "and local_forward > 0.0" not in text

          meta = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          assert meta["project"]["version"] == meta["tool"]["sdkmod"]["version"] == "1.2.3"
          assert tuple(int(x) for x in meta["project"]["version"].split(".")) == (1, 2, 3)

          stage = Path("stage/BL4_SuperDash")
          stage.mkdir(parents=True, exist_ok=True)
          for name in ("__init__.py","pyproject.toml","README.md","README_RU.md","LICENSE","ADDITIONAL_TERMS.md"):
              (stage / name).write_bytes(Path(name).read_bytes())

          archive = Path("dist/BL4_SuperDash.sdkmod")
          archive.parent.mkdir(exist_ok=True)
          with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_DEFLATED) as zf:
              for path in sorted(stage.rglob("*")):
                  if path.is_file():
                      zf.write(path, path.relative_to(stage.parent).as_posix())

          with zipfile.ZipFile(archive) as zf:
              names=[n for n in zf.namelist() if n and not n.endswith("/")]
              assert archive.stem=="BL4_SuperDash"
              assert {n.split("/",1)[0] for n in names}=={"BL4_SuperDash"}
              assert len(names)==6
              assert "BL4_SuperDash/__init__.py" in names
              assert not any("__pycache__" in n or n.endswith((".pyc",".pyo")) for n in names)

          print("source_sha256", hashlib.sha256(source.read_bytes()).hexdigest())
          print("artifact_sha256", hashlib.sha256(archive.read_bytes()).hexdigest())
          print("ALL_GATES_PASS")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: BL4-SuperDash-v1.2.3-omni-compat-candidate
          path: dist/BL4_SuperDash.sdkmod
          if-no-files-found: error
